services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mediflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mediflow}
      POSTGRES_DB: ${POSTGRES_DB:-mediflow}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediflow"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: &env-backend
      - path: ./backend/.env
        required: false
    environment: &entorno-backend
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mediflow}:${POSTGRES_PASSWORD:-mediflow}@db:5432/${POSTGRES_DB:-mediflow}
      STORAGE_LOCAL_DIR: /srv/storage
      PROCESAMIENTO_EN_WORKER: "true"   # la API acepta y guarda (RN-P1); el servicio worker corre el triaje
    volumes:
      - documentos:/srv/storage          # respaldo local de originales y JSON cuando OCI no está configurado
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    env_file: *env-backend
    environment: *entorno-backend
    volumes:
      - documentos:/srv/storage
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy     # la API aplica las migraciones al arrancar; el worker espera a que estén

  web:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  documentos:
