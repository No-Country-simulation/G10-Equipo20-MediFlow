services:
  api:
    build:
      context: ./backend
      target: runtime
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-mediflow}
      POSTGRES_USER: ${POSTGRES_USER:-mediflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      DOCUMENTS_DIR: /data/documents
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-90}
      PROCESSING_MAX_PAGES: ${PROCESSING_MAX_PAGES:-20}
      PROCESSING_MAX_CHARACTERS: ${PROCESSING_MAX_CHARACTERS:-50000}
      PDF_TIMEOUT_SECONDS: ${PDF_TIMEOUT_SECONDS:-30}
      MAX_PROCESSING_ATTEMPTS: ${MAX_PROCESSING_ATTEMPTS:-3}
    volumes:
      - documents_data:/data/documents
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mediflow}
      POSTGRES_USER: ${POSTGRES_USER:-mediflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      POSTGRES_HOST: db-test
      POSTGRES_DB: mediflow_test
      POSTGRES_USER: mediflow_test
      POSTGRES_PASSWORD: test_only_password
      DOCUMENTS_DIR: /tmp/mediflow-test-documents
      TESTING: "1"
    depends_on:
      db-test:
        condition: service_healthy

  db-test:
    profiles: ["test"]
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: mediflow_test
      POSTGRES_USER: mediflow_test
      POSTGRES_PASSWORD: test_only_password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediflow_test -d mediflow_test"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  documents_data:
